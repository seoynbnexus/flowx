        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Settlement result

  /admin/campaigns/{id}/approve:
    post:
      tags: [Admin Campaigns]
      summary: Approve campaign, create Meta objects and activate (admin, campaigns.review, 202 when queued)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                publisherCount:
                  type: integer
      responses:
        "200":
          description: Approved synchronously (fast paths)
        "202":
          description: Approval queued; poll the job
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/QueuedJob"

  /admin/campaigns/{id}/reject:
