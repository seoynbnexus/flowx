      summary: Preview repair eligibility without mutating (admin, campaigns.review)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: executionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaAssetId:
                  type: string
                  format: uuid
                mediaUrl:
                  type: string
                  format: uri
                issueCode:
                  type: string
      responses:
        "200":
          description: Per-check preview result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/RepairPreviewResult"

