  /admin/campaigns/{campaignId}/executions/{executionId}/repairs:
    post:
      tags: [Admin Campaigns]
      summary: Request execution repair with replacement media (admin, campaigns.review, 202)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: executionId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mediaAssetId:
                  type: string
                  format: uuid
                mediaUrl:
                  type: string
                  format: uri
                  description: Direct image/video URL, sent to Meta as-is. Exactly one of mediaAssetId or mediaUrl is required.
                issueCode:
                  type: string
      responses:
        "202":
          description: Repair queued (or duplicate acknowledgment)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/RepairRequestResult"
        "403":
          description: Rollout off, kill switch on, or missing permission
        "422":
          description: Media outside Facebook/Instagram criteria, unknown issue, or validation failure

  /admin/campaigns/{campaignId}/executions/{executionId}/repair-status:
    get:
      tags: [Admin Campaigns]
      summary: Execution repair status, eligibility, and active repair (admin, campaigns.review)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: campaignId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: executionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Repair status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/ExecutionRepairStatus"
        "422":
          description: Execution does not belong to this campaign

  /admin/campaigns/{campaignId}/executions/{executionId}/repair-preview:
    post:
