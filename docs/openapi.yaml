        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Campaign detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/Campaign"
        "404":
          description: Campaign not found

  /admin/campaigns/{id}/sync:
    post:
      tags: [Admin Campaigns]
      summary: Force per-campaign Meta sync via account job (admin, campaigns.review, 202)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Sync queued

  /admin/campaigns/{id}/settle:
    post:
