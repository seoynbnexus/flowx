openapi: "3.0.3"
info:
  title: FlowX API
  description: |
    FlowX is a social media advertising platform connecting clients with publishers.
    Supports Instagram and Facebook account linking for ad placements.
  version: "1.0.0"
  contact:
    name: FlowX Team
    email: admin@flowx.com

servers:
  - url: http://localhost:3001/api/v1
    description: Development server
  - url: https://api.flowx.com/api/v1
    description: Production server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
        data:
          type: object

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    IdentityDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        documentType:
          type: string
          enum: [aadhaar, drivers_license]
        documentUrl:
          type: string
        status:
          type: string
          enum: [pending, verified, rejected]
        rejectedReason:
          type: string
          nullable: true
        verifiedBy:
          type: string
          format: uuid
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaAsset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        storagePath:
          type: string
        url:
          type: string
        mimeType:
          type: string
          nullable: true
        mediaKind:
          type: string
          enum: [image, video]
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MediaConfig:
      type: object
      properties:
        quotaBytes:
          type: integer
        maxFileBytes:
          type: integer

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, inactive, blocked, pending]
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string

    UserProfile:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string
          nullable: true
        country_code:
          type: string
        state:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        metadata:
          type: object

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        is_system:
          type: boolean
        is_super_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        module:
          type: string
        description:
          type: string
          nullable: true

    PlatformAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        platformId:
          type: string
          format: uuid
        profileUrl:
          type: string
          format: uri
        platformUsername:
          type: string
          nullable: true
        platformDisplayName:
          type: string
          nullable: true
        verificationStatus:
          type: string
          enum: [pending, verified, rejected]
        isActive:
          type: boolean
        platformCode:
          type: string
        platformName:
          type: string
        createdAt:
          type: string
          format: date-time

    AdCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [draft, pending_review, approved, scheduled, running, paused, completed, cancelled, failed, awaiting_publishers, archived]
        metaStatus:
          type: string
          nullable: true
        metaError:
          type: string
          nullable: true
        metaIssues:
          type: array
          items:
            $ref: "#/components/schemas/CampaignMetaIssue"
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CampaignCreative:
      type: object
      properties:
        mediaUrl:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        hashtags:
          type: string
          nullable: true
        textBody:
          type: string
          nullable: true
        callToAction:
          type: string
          nullable: true
        headline:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    CampaignMetaSettings:
      type: object
      properties:
        objective:
          type: string
        budgetType:
          type: string
          nullable: true
        budgetAmount:
          type: number
          nullable: true
        platformPlacement:
          type: object
          nullable: true
        targeting:
          type: object
          nullable: true

    CampaignMetaIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
          nullable: true
        executionKind:
          type: string
          nullable: true
        ownerUserId:
          type: string
          format: uuid
          nullable: true
        objectId:
          type: string
        creativeId:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
        errorCode:
          type: string
        summary:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        errorType:
          type: string
          nullable: true
        active:
          type: boolean
        observedAt:
          type: string
          format: date-time
        clearedAt:
          type: string
          format: date-time
          nullable: true
        category:
          type: string
          nullable: true
        guidance:
          type: string
          nullable: true

    ExecutionRepairStatus:
      type: object
      properties:
        executionId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        kind:
          type: string
        ownerUserId:
          type: string
          format: uuid
        health:
          type: string
          enum: [HEALTHY, ACTION_REQUIRED]
        workflowState:
          type: string
        eligible:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            type: object
        activeRepair:
          type: object
          nullable: true
        lastRepair:
          type: object
          nullable: true
        completedRepairs:
          type: integer
        generation:
          type: object
          nullable: true

    RepairPreviewResult:
      type: object
      properties:
        ok:
          type: boolean
        checks:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              ok:
                type: boolean
              message:
                type: string
                nullable: true
        issue:
          type: object
          nullable: true
        media:
          type: object
          nullable: true
          properties:
            assetId:
              type: string
              format: uuid
              nullable: true
            url:
              type: string
            width:
              type: integer
              nullable: true
            height:
              type: integer
              nullable: true
            name:
              type: string
              nullable: true
            kind:
              type: string
              nullable: true
            durationSeconds:
              type: number
              nullable: true
        execution:
          type: object
          nullable: true

    RepairRequestResult:
      type: object
      properties:
        repairId:
          type: string
          format: uuid
        runKey:
          type: string
        status:
          type: string
        queued:
          type: boolean
        duplicate:
          type: boolean
        rearmed:
          type: boolean

    RepairReadiness:
      type: object
      properties:
        ready:
          type: boolean
        stage:
          type: integer
        flags:
          type: object
        checks:
          type: array
          items:
            type: object
        fleet:
          type: object
        metrics:
          type: object

    MetaAdAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
        name:
          type: string
          nullable: true
        monthlyCapPaise:
          type: integer
        isPrimary:
          type: boolean
        status:
          type: string
          enum: [active, disabled]

    QueuedJob:
      type: object
      properties:
        queued:
          type: boolean
        jobId:
          type: string
          format: uuid
        executionId:
          type: string
          format: uuid
          nullable: true

tags:
  - name: Auth
    description: Authentication and registration
  - name: Users
    description: User profile management
  - name: Roles
    description: Role management
  - name: Permissions
    description: Permission management
  - name: Publisher
    description: Publisher social account management
  - name: Admin
    description: Admin operations (platform accounts, categories)
  - name: Ad Categories
    description: Ad category management
  - name: Identity Documents
    description: Identity document upload and verification for publishers
  - name: Admin Identities
    description: Admin operations for identity document management
  - name: Health
    description: Health check
  - name: Campaigns
    description: Client campaign lifecycle and Meta settings
  - name: Admin Campaigns
    description: Admin campaign review, Meta operations, and execution repair

paths:
  /identity/documents:
    post:
      tags: [Identity Documents]
      summary: Upload identity document (publisher)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - documentType
                - file
              properties:
                documentType:
                  type: string
                  enum: [aadhaar, drivers_license]
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Document submitted for verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/IdentityDocument"

    get:
      tags: [Identity Documents]
      summary: Get my identity document (publisher)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Identity document details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/IdentityDocument"

  /admin/identity-documents:
    get:
      tags: [Admin Identities]
      summary: List all identity documents (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, verified, rejected]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of identity documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/IdentityDocument"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /admin/identity-documents/{id}/verify:
    patch:
      tags: [Admin Identities]
      summary: Verify or reject identity document (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [verified, rejected]
                rejectedReason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Document status updated

  /media:
    post:
      tags: [Media Library]
      summary: Upload a media asset (client)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
      responses:
        "201":
          description: Media uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/MediaAsset"
        "422":
          description: Invalid media type, empty file, per-file limit, or quota exceeded

    get:
      tags: [Media Library]
      summary: List my media assets (client)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
        - in: query
          name: kind
          schema:
            type: string
            enum: [image, video]
      responses:
        "200":
          description: Paginated media assets with storage totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaAsset"
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalBytes:
                        type: integer
                      quotaBytes:
                        type: integer

  /media/{id}:
    delete:
      tags: [Media Library]
      summary: Delete a media asset (client)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Media deleted
        "403":
          description: Cannot delete another user's media
        "404":
          description: Media asset not found
        "409":
          description: Media is referenced by a live post

  /admin/media/config:
    get:
      tags: [Media Library Admin]
      summary: Get media configuration (admin)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Media config
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/MediaConfig"

    put:
      tags: [Media Library Admin]
      summary: Update media configuration (admin)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quotaBytes:
                  type: integer
                maxFileBytes:
                  type: integer
      responses:
        "200":
          description: Media config updated

  /posts/boost-capabilities:
    get:
      tags: [Posts]
      summary: Backend-owned boost capability registry (versioned; frontend renders only these options)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Objectives, per-platform contexts, positions, device platforms, graphVersion
        "401":
          description: Unauthorized

  /posts/{id}/boost-performance:
    get:
      tags: [Posts]
      summary: Ad performance of a boosted post (client, DB-cached; raw Meta IDs excluded)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
          description: Enqueue an asynchronous performance sync and return stored data with queued=true
      responses:
        "200":
          description: Per-target daily stats, totals and freshness
        "403":
          description: Not your post
        "404":
          description: Post not found

  /admin/posts/{id}/boost-performance:
    get:
      tags: [Posts Admin]
      summary: Ad performance of a boosted post (admin; includes Meta-ID debug block)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Per-target daily stats, totals and freshness
        "404":
          description: Post not found

  /admin/posts/{id}/violations:
    get:
      tags: [Posts Admin]
      summary: Deletion-violation targets of a post (admin; flagged/confirmed/dismissed + request accounting)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Violation targets and per-request violation/clawback state

  /admin/posts/{id}/violations/{targetId}/review:
    post:
      tags: [Posts Admin]
      summary: Review a confirmed deletion violation (dismiss clears the violation decision only; clawback is strict all-or-nothing; deletion stays terminal)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: targetId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [dismiss, clawback]
      responses:
        "200":
          description: Review applied
        "404":
          description: Post target not found
        "409":
          description: Already reviewed / already clawed back
        "422":
          description: Not a confirmed violation, or insufficient publisher balance for clawback

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  # ─── AUTH ────────────────────────────────────────────────────────

  /auth/send-registration-otp:
    post:
      tags: [Auth]
      summary: Send OTP to email for registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP sent
        "409":
          description: Email already registered
        "422":
          description: Disposable email or invalid input

  /auth/verify-registration-otp:
    post:
      tags: [Auth]
      summary: Verify OTP and receive verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      verificationToken:
                        type: string
        "422":
          description: Invalid or expired OTP

  /auth/register:
    post:
      tags: [Auth]
      summary: Complete registration with verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken, password]
              properties:
                verificationToken:
                  type: string
                password:
                  type: string
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
                phone:
                  type: string
                  pattern: '^\+[1-9]\d{9,14}$'
                state:
                  type: string
                  pattern: '^[A-Za-z\s]+$'
                role:
                  type: string
                  enum: [client, publisher]
                  default: publisher
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
        "401":
          description: Invalid or expired verification token
        "409":
          description: Email already registered

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                deviceName:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
        "401":
          description: Invalid credentials
        "403":
          description: Account blocked, inactive, or locked

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token refreshed

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and invalidate session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Logged out

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset email sent if account exists

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
