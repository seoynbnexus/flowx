      summary: Delete Meta ad account (admin, campaigns.review)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Ad account deleted

  /admin/campaigns:
    get:
      tags: [Admin Campaigns]
      summary: List all campaigns (admin, campaigns.review)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: clientId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Paginated campaigns

  /admin/campaigns/{id}:
    get:
